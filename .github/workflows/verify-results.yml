name: Verify published results

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install verification dependencies
        run: python -m pip install numpy==2.1.3 pandas==2.2.3 scipy==1.16.3

      - name: Development ablation (Tables 5-8)
        run: python scripts/verify_published_results.py

      - name: Development comparators (Tables 9-10)
        run: python development_comparators/verify_comparator_numbers.py

      - name: External validation (Sections 5.8-5.10, Tables 11-21)
        run: python external_validation/code/verify_reported_numbers.py
